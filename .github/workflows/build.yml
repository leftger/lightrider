name: CI

on:
  push:
    branches: [main, master, feat/bevy-port, feat/wip]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create new release draft and publish packages"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Format / Clippy / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxcb-randr0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  platform-check:
    name: Check ${{ matrix.os_label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: Linux
          - os: windows-latest
            os_label: Windows
          - os: macos-latest
            os_label: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxcb-randr0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  create-release:
    name: Prepare Release Version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    if: (github.event_name == 'workflow_dispatch' && inputs.create_release) || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Get version from Tag or Default
        id: get-version
        run: |
          VERSION=""
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.1.0-manual-$(date +%s)"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: Lightrider v${{ steps.get-version.outputs.version }}
          body: |
            Cross-platform Lightrider packages (3D File Explorer & Lightcycle Grid).
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and Package ${{ matrix.os_label }}
    needs: [create-release]
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_label: Linux
          - os: windows-latest
            os_label: Windows
          - os: macos-latest
            os_label: macOS

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxcb-randr0-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --profile release --locked

      - name: Package Windows Bundle
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/lightrider
          cp target/release/lightrider.exe dist/lightrider/
          cp -r assets dist/lightrider/
          cp README.md LICENSE dist/lightrider/ 2>/dev/null || true
          cd dist && 7z a lightrider-windows-x86_64.zip lightrider

      - name: Package Linux Bundle
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist/lightrider
          cp target/release/lightrider dist/lightrider/
          cp -r assets dist/lightrider/
          cp README.md LICENSE dist/lightrider/ 2>/dev/null || true
          cd dist && tar -czf lightrider-linux-x86_64.tar.gz lightrider

      - name: Package macOS Bundle
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist/lightrider
          cp target/release/lightrider dist/lightrider/
          cp -r assets dist/lightrider/
          cp README.md LICENSE dist/lightrider/ 2>/dev/null || true
          ARCH=$(uname -m)
          cd dist
          tar -czf lightrider-macos-${ARCH}.tar.gz lightrider
          if [ "$ARCH" = "arm64" ]; then
            cp lightrider-macos-arm64.tar.gz lightrider-macos-aarch64.tar.gz
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightrider-${{ matrix.os_label }}
          path: dist/lightrider-*.*

      - name: Upload Packages to Release
        if: needs.create-release.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: dist/lightrider-*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
